[package]
name = "kira"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
serde_json = "1.0"
async-imap = "0.10"
async-native-tls = "0.5"
async-std = { version = "1.13", features = ["attributes"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
mailparse = "0.15"
